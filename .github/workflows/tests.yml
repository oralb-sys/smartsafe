name: Pruebas unitarias - SmartSafe

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar dependencias
        run: npm install

      - name: Crear archivo .env de prueba
        run: |
          echo "MARIA_HOST=localhost" >> .env
          echo "MARIA_USER=test" >> .env
          echo "MARIA_PASSWORD=test" >> .env
          echo "MARIA_DATABASE=test" >> .env

      - name: Ejecutar pruebas unitarias
        run: npm test