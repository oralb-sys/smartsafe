services:
  mariadb:
    image: mariadb:11.4
    container_name: smartsafe-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: smartsafe
      MARIADB_USER: smartsafe_user
      MARIADB_PASSWORD: smartsafe_password
      MARIADB_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data: